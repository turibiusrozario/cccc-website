<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Cross Campus Climate Coalition logo: three graduation caps and one college building joined in a ring">
  <!-- Colors (3 only): forest #0F4C3A, amber #F5B700, white #FFFFFF -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#0F4C3A" stroke-width="7"/>
  <!-- Institution (top): solid forest badge, white building -->
  <g transform="translate(50 18)">
    <circle r="15" fill="#0F4C3A"/>
    <polygon points="-9,-3 0,-9 9,-3" fill="#FFFFFF"/>
    <rect x="-6.5" y="-1" width="3" height="7" fill="#FFFFFF"/>
    <rect x="-1.5" y="-1" width="3" height="7" fill="#FFFFFF"/>
    <rect x="3.5" y="-1" width="3" height="7" fill="#FFFFFF"/>
    <rect x="-9" y="7" width="18" height="2.5" fill="#FFFFFF"/>
  </g>
  <!-- Graduation caps (right, bottom, left): amber badge, forest outline and cap -->
  <g id="cap-r" transform="translate(82 50)">
    <circle r="14" fill="#F5B700" stroke="#0F4C3A" stroke-width="3.5"/>
    <path d="M-5.5 1.5 V6 Q0 9 5.5 6 V1.5 L0 4Z" fill="#0F4C3A"/>
    <polygon points="0,-8 10,-2.5 0,3 -10,-2.5" fill="#0F4C3A"/>
  </g>
  <g transform="translate(50 82)">
    <circle r="14" fill="#F5B700" stroke="#0F4C3A" stroke-width="3.5"/>
    <path d="M-5.5 1.5 V6 Q0 9 5.5 6 V1.5 L0 4Z" fill="#0F4C3A"/>
    <polygon points="0,-8 10,-2.5 0,3 -10,-2.5" fill="#0F4C3A"/>
  </g>
  <g transform="translate(18 50)">
    <circle r="14" fill="#F5B700" stroke="#0F4C3A" stroke-width="3.5"/>
    <path d="M-5.5 1.5 V6 Q0 9 5.5 6 V1.5 L0 4Z" fill="#0F4C3A"/>
    <polygon points="0,-8 10,-2.5 0,3 -10,-2.5" fill="#0F4C3A"/>
  </g>
</svg>
